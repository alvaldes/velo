# Pre-build hooks for the cross-built target (the release workflow builds
# aarch64-unknown-linux-gnu with `cross` on the ubuntu x86_64 runner).
#
# Run 42519251288 (tag v0.10.1) proved the cross image's claims wrong:
# its glibc image carries the aarch64 toolchain, but it ships neither the
# ALSA development headers cpal links against (alsa-sys died with
# "No package 'alsa' found" from pkg-config) nor cmake, which audiopus_sys
# needs to build the bundled libopus. This hook installs both inside the
# container before cargo runs the build scripts.
#
# libasound2-dev is installed for the foreign (target) architecture so
# pkg-config finds alsa.pc under /usr/lib/aarch64-linux-gnu/pkgconfig;
# cmake is an arch-independent binary, so it is installed without a
# :$CROSS_DEB_ARCH suffix. CMAKE_POLICY_VERSION_MINIMUM=3.5 from
# .cargo/config.toml applies to build scripts inside the container too,
# because cross runs cargo itself.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes --no-install-recommends libasound2-dev:$CROSS_DEB_ARCH cmake",
]

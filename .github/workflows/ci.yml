name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # audiopus_sys builds libopus from its own CMakeLists, which declares a
    # minimum CMake older than 4.x accepts; the escape hatch is documented.
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal needs ALSA headers; audiopus_sys builds libopus from source with
      # cmake, so both are build dependencies, not test-only ones.
      # Build dependencies, not test-only ones: cpal needs the ALSA headers on
      # Linux, and audiopus_sys builds libopus with cmake — which the runner
      # images already ship, so it is installed only where it is cheap to be
      # explicit about it.
      - name: Install Linux build dependencies (ALSA headers)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

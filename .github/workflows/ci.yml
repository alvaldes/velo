name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal needs ALSA headers; audiopus_sys builds libopus from source with
      # cmake, so both are build dependencies, not test-only ones.
      # Build dependencies, not test-only ones: cpal needs the ALSA headers, and
      # audiopus_sys builds libopus from its own sources — with cmake on
      # Linux, and through `sh autogen.sh` + `./configure` on macOS, which
      # needs autotools that the macOS runner does not ship.
      - name: Install Linux build dependencies (ALSA headers)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake autoconf automake libtool
      - name: Install macOS build dependencies (autotools for the Opus build)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

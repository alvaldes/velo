name: Release

on:
  push:
    tags:
      - "v*"
  # A tag push is the normal path. This exists because the first release had to
  # be built by hand: the push trigger never reached GitHub for it, and a
  # release that cannot be re-run is a release that cannot be repaired.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.10.1"
        required: true

permissions:
  contents: write

env:
  # A tag push sets ref_name; a manual run passes the tag explicitly.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA development headers (native Linux build)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # aarch64 Linux is cross-built on the ubuntu x86_64 runner with `cross`:
      # its glibc image carries the aarch64 toolchain and the ALSA headers
      # cpal links against, so one tool covers both halves of the job.
      - name: Install cross (aarch64 Linux cross-build)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross, aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="velo-${TAG}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/velo" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "${dir}.tar.gz" "$dir"
          shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: velo-${{ env.TAG }}-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach archives to the GitHub Release (created if missing)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

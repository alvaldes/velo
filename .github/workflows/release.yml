name: Release

on:
  push:
    tags:
      - "v*"
  # A tag push is the normal path. This exists because the first release had to
  # be built by hand: the push trigger never reached GitHub for it, and a
  # release that cannot be re-run is a release that cannot be repaired.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.10.1"
        required: true

permissions:
  contents: write

env:
  # A tag push sets ref_name; a manual run passes the tag explicitly.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ALSA is what cpal links against; libdbus is what souvlaki's `use_dbus`
      # backend needs, and the v0.28.0-v0.30.0 tags still pull it.
      - name: Install the system headers the Linux build needs (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev

      # aarch64 Linux is cross-built on the ubuntu x86_64 runner with `cross`.
      # The cross image carries the aarch64 toolchain, but NOT the ALSA headers
      # or cmake the dependencies need — run 42519251288 (v0.10.1) died in
      # alsa-sys with "No package 'alsa' found". Cross.toml's pre-build hook
      # installs libasound2-dev and cmake inside the container before any
      # build script runs, so no extra step is needed here.
      - name: Install cross (aarch64 Linux cross-build)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross, aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="velo-${TAG}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/velo" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "${dir}.tar.gz" "$dir"
          shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: velo-${{ env.TAG }}-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach archives to the GitHub Release (created if missing)
        uses: softprops/action-gh-release@v2
        with:
          # A tag push already points `github.ref` at the tag; a manual run
          # does not (it points at the branch), so the tag has to be named or
          # the action refuses with "GitHub Releases requires a tag".
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true

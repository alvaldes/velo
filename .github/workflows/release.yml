name: Release

on:
  push:
    tags:
      - "v*"
  # A tag push is the normal path. This exists because the first release had to
  # be built by hand: the push trigger never reached GitHub for it, and a
  # release that cannot be re-run is a release that cannot be repaired.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.10.1"
        required: true

permissions:
  contents: write

env:
  # A tag push sets ref_name; a manual run passes the tag explicitly.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ALSA is what cpal links against; libdbus is what souvlaki's `use_dbus`
      # backend needs, and the v0.28.0-v0.30.0 tags still pull it.
      - name: Install the system headers the Linux build needs (native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev

      # aarch64 Linux is cross-built on the ubuntu x86_64 runner with `cross`.
      # The cross image carries the aarch64 toolchain, but NOT the ALSA headers
      # or cmake the dependencies need — run 42519251288 (v0.10.1) died in
      # alsa-sys with "No package 'alsa' found". Cross.toml's pre-build hook
      # installs libasound2-dev and cmake inside the container before any
      # build script runs, so no extra step is needed here.
      # The tags from v0.28.0 to v0.30.0 carry a `Cross.toml` written before
      # `souvlaki` existed, so their pre-build hook installs no dbus headers and
      # `cross` reads that file from the tag, not from this branch. Add the
      # package here when it is missing; newer tags already ship it, and the
      # grep makes this a no-op for them.
      - name: Add the dbus headers to the cross image (tags older than this hook)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          if ! grep -q libdbus-1-dev Cross.toml; then
            sed -i 's/libasound2-dev:\$CROSS_DEB_ARCH cmake/libasound2-dev:\$CROSS_DEB_ARCH libdbus-1-dev:\$CROSS_DEB_ARCH cmake/' Cross.toml
            grep -q libdbus-1-dev Cross.toml || { echo "could not patch Cross.toml"; exit 1; }
          fi
          grep -n libdbus-1-dev Cross.toml

      - name: Install cross (aarch64 Linux cross-build)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross, aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="velo-${TAG}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/velo" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "${dir}.tar.gz" "$dir"
          shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: velo-${{ env.TAG }}-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach archives to the GitHub Release (created if missing)
        uses: softprops/action-gh-release@v2
        with:
          # A tag push already points `github.ref` at the tag; a manual run
          # does not (it points at the branch), so the tag has to be named or
          # the action refuses with "GitHub Releases requires a tag".
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true

      # The tap's formula is written from this release's checksums, so the
      # release that publishes them is the one that must point the formula at
      # them. The tap used to rely on its own ten-minute cron, which ran before
      # v1.0.0's archives existed (and then refused, correctly) and was still
      # fifteen minutes behind in the other direction.
      #
      # The tap is another repository, which this workflow's own token cannot
      # touch: `TAP_TOKEN` is a fine-grained token scoped to
      # alvaldes/homebrew-tap with Actions: write. Without it the step warns and
      # stops — the tap's cron still catches up, and a missing token never
      # fails a release that already published its archives.
      - name: Point the tap's formula at this release
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Tap not updated::TAP_TOKEN is missing — add a fine-grained token with Actions: Read and write on alvaldes/homebrew-tap; its cron will catch up meanwhile."
            exit 0
          fi
          tap=alvaldes/homebrew-tap
          # The tap's run ids, oldest first. `--ref main` keeps the dispatch from
          # asking GraphQL for the default branch, which a fine-grained token
          # would need `Contents: read` for.
          ids() { gh run list --repo "$tap" --workflow update.yml --limit 20 --json databaseId --jq '.[].databaseId' | sort -n; }
          # `gh workflow run` prints nothing when stdout is a pipe, which is
          # exactly how a runner calls it, so the dispatched run is found by its
          # id being NEW — never by parsing that output, and never by taking the
          # newest run, which may be the cron's own run for an older tag.
          ids > "$RUNNER_TEMP/tap-before"
          for attempt in 1 2 3; do
            gh workflow run update.yml --repo "$tap" -r main -f tag="$TAG"
            id=""
            for _ in $(seq 1 12); do
              sleep 5
              ids > "$RUNNER_TEMP/tap-now"
              id=$(comm -13 "$RUNNER_TEMP/tap-before" "$RUNNER_TEMP/tap-now" | tail -1)
              if [ -n "$id" ]; then break; fi
            done
            if [ -z "$id" ]; then
              echo "attempt $attempt: the dispatch started no run this step can see"
              ids > "$RUNNER_TEMP/tap-before"
              continue
            fi
            # A bounded poll of this run's own answer: `gh run watch` never
            # times out, and this job must.
            state=""
            for _ in $(seq 1 24); do
              sleep 5
              state=$(gh run view "$id" --repo "$tap" --json status,conclusion --jq '.status + "/" + (.conclusion // "none")')
              case "$state" in
                completed/*) break ;;
              esac
            done
            if [ "$state" = "completed/success" ]; then
              echo "the tap points at $TAG"
              exit 0
            fi
            echo "attempt $attempt: the tap's run $id answered $state"
            ids > "$RUNNER_TEMP/tap-before"
          done
          # A tap that did not take this release must not turn a release whose
          # archives are already public red: the cron still catches up, and the
          # annotation is where the drift is seen.
          echo "::warning title=Tap not updated::$tap did not accept $TAG; its ten-minute cron will catch up"
          exit 0

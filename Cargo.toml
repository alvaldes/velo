[package]
name = "velo"
version = "0.21.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A fast, single-binary music player for your terminal"
repository = "https://github.com/alvaldes/velo"
readme = "README.md"
keywords = ["music", "player", "tui", "terminal", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]
# Internal project notes never belong in a published crate.
exclude = [".mise.toml", "odd/", "design/"]

[dependencies]
# Opus decode (T14): libopus built statically by audiopus_sys — no dynamic
# runtime dependency (measured in L47: ~400 KB on an 8.9 MB binary, otool shows
# none). audiopus_sys 0.1 (behind 0.2) builds libopus with autogen.sh/configure
# — autotools, which macOS runners do not ship — while audiopus_sys 0.2 builds
# it with cmake. The 0.3 binding that pulls sys 0.2 is a release candidate, so
# the requirement is exact on purpose: an RC must never drift under us, and a
# caret bump to a different RC would be an unreviewed API change.
audiopus = "=0.3.0-rc.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jwalk = "0.9.0"
lofty = "0.24.0"
# MD5 for the Subsonic token auth (t = md5(password + salt)). RustCrypto's
# implementation: small, pure Rust, no unsafe.
md-5 = "0.10"
nucleo-matcher = "0.3.1"
ratatui = "0.28"
ratatui-image = { version = "2", default-features = false, features = ["crossterm", "rustix"] }
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# The Subsonic wire format is JSON (f=json), which serde alone cannot
# parse. miniserde rather than serde_json: its extra `PartialEq<Value>`
# impl for usize breaks inference in existing tests (`assert_eq!(…, [])`)
# and would force edits this task may not make.
miniserde = "0.1.46"
symphonia = { version = "0.6", features = ["mp3", "aac", "flac", "vorbis", "ogg", "wav", "isomp4"] }
toml = "0.9"
# One blocking GET at a time fits the player's synchronous shape; rustls for
# TLS instead of the platform store keeps the build self-contained.
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "velo"
path = "src/bin/velo.rs"

[package]
name = "velo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A fast, single-binary music player for your terminal"
repository = "https://github.com/alvaldes/velo"
readme = "README.md"
keywords = ["music", "player", "tui", "terminal", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jwalk = "0.9.0"
lofty = "0.24.0"
nucleo-matcher = "0.3.1"
ratatui = "0.29"
ratatui-image = { version = "1.0.1", default-features = false, features = ["crossterm", "rustix"] }
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "ogg", "wav", "isomp4"] }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

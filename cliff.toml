# git-cliff: the changelog and the next version, both read from the
# Conventional Commits since the last `v*` tag. Used by scripts/release.sh.

[changelog]
header = """
# Changelog

Every release of velo, newest first, generated from its Conventional Commits.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^docs\\(odd\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci|chore)", group = "<!-- 6 -->Maintenance" },
]

[bump]
# While velo is 0.x a feature bumps the minor, and so does a breaking change.
features_always_bump_minor = true
breaking_always_bump_major = false
